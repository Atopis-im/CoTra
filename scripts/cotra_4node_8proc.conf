# cotra_4node_8proc.conf
#
# 4 physical nodes x 2 CoTra processes = 8 ranks (COTRA_MACHINE_NUM=8).
# Format (consumed by src/rdma/ip_config.cc):
#   line 1 : leader / memcached host
#   line 2 : memcached port
#   line 3+: <RoCE-IP>=<rank>
#
# Each physical node runs TWO ranks. Rank r is placed on node (r mod 4):
#   rank 0 -> node 0 (33.40.10.121)   rank 4 -> node 0 (33.40.10.121)
#   rank 1 -> node 1 (33.40.10.122)   rank 5 -> node 1 (33.40.10.122)
#   rank 2 -> node 2 (33.40.10.123)   rank 6 -> node 2 (33.40.10.123)
#   rank 3 -> node 3 (33.40.10.124)   rank 7 -> node 3 (33.40.10.124)
#
# Each node IP therefore appears on two lines. ip_config::get_machine_id(),
# which keys on IP, would collide on the duplicate IPs - that is exactly why
# every process must be launched with an explicit --rank that overrides the
# IP-based lookup (see rdma_param.cc / index_param.cc).
#
# This file is an EXAMPLE; the launcher script regenerates it into the build
# dir at <build>/cotra_4node_8proc.conf every run, so you normally do not edit
# it by hand. Edit the --node*-rdma-ip / --leader-ip / --memcached-port
# options of scripts/arm_roce_4node_8proc.sh instead.
